[pytest]
# Assignment 3 — Unit Test Automation configuration for ONE-CLICK-AGENT.
# Existing regression tests live in tests/*.py; new assignment tests live in
# tests/unit/ and tests/data/. See docs/assignment3/test_execution_guide.md.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -ra --strict-markers

markers =
    smoke: fast sanity checks run first
    unit: assignment 3 unit tests
    regression: pre-existing regression suite (auto-applied to tests/*.py)
    assignment3: all assignment 3 tests (auto-applied to tests/unit and tests/data)
    config: tests for app/config.py
    validation: tests for app/response_models.py
    screen_detection: tests for app/screen_change_detector.py
    csv_data: CSV-driven data tests
