<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hackathon Event Registration (demo form)</title>
<style>
 body{font-family:Segoe UI,Arial,sans-serif;background:#eef2f7;margin:0;padding:40px;color:#111827}
 form{max-width:560px;margin:auto;background:#fff;border-radius:14px;padding:28px 36px;box-shadow:0 4px 24px #0001}
 h2{margin-top:0} label{display:block;font-weight:600;margin:14px 0 6px;font-size:15px}
 input,select,textarea{width:100%;padding:10px;font-size:15px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}
 .req{color:#dc2626} #out{margin-top:16px;color:#15803d}
</style></head><body>
<form onsubmit="event.preventDefault();document.getElementById('out').textContent='Submitted (demo only — nothing was sent).'">
 <h2>Hackathon Event Registration</h2>
 <label>Full name <span class="req">*</span></label><input type="text" name="name">
 <label>Email address <span class="req">*</span></label><input type="email" name="email">
 <label>University / Organization</label><input type="text" name="org">
 <label>Team name</label><input type="text" name="team">
 <label>T-shirt size</label><select name="size"><option></option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
 <label>Why do you want to attend?</label><textarea name="why" rows="3"></textarea>
 <label>Password for event portal</label><input type="password" name="pw">
 <button type="submit" style="margin-top:18px;padding:10px 18px">Submit</button>
 <div id="out"></div>
</form></body></html>
